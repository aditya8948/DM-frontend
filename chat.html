<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - DM</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="user-info">
        <div class="avatar" id="user-avatar">--</div>
        <div>
          <h3 class="user-name" id="user-display-name">Chat</h3>
          <span class="user-status" id="room-status">No room joined</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="email" id="partner-email" placeholder="Enter user email..." style="padding: 6px 10px; border-radius: 6px; border: 1px solid #d0d7de; font-size: 13px; outline: none;" />
        <button type="button" id="join-room-btn" class="logout-btn" style="background: #2563eb; color: #fff; border: none; font-weight: 500;">Join</button>
      </div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </header>

    <main class="chat-messages" id="chat-messages">
      <div class="date-divider"><span>Today</span></div>
    </main>

    <footer class="chat-input-area">
      <form id="chat-form" class="chat-form">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Type a message..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="send-btn" class="send-btn" title="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const userAvatar = document.getElementById('user-avatar');

    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user'));

    if (!token || !currentUser) {
      window.location.href = 'login.html';
    } else {
      userDisplayName.textContent = currentUser.name;
      userAvatar.textContent = (currentUser.name || 'U').slice(0, 2).toUpperCase();
    }

    let currentRoomId = null;
    let targetUserEmail = null;
    const partnerEmailInput = document.getElementById('partner-email');
    const joinRoomBtn = document.getElementById('join-room-btn');
    const roomStatus = document.getElementById('room-status');

    const socket = io('http://localhost:5000');

    function joinConversationRoom(partnerEmail) {
      if (!partnerEmail || !partnerEmail.trim()) {
        alert('Please enter a user email');
        return;
      }
      const trimmed = partnerEmail.trim().toLowerCase();
      if (trimmed === currentUser.email.toLowerCase()) {
        alert('Enter another user email to chat with');
        return;
      }
      targetUserEmail = trimmed;
      const emails = [currentUser.email.toLowerCase(), targetUserEmail].sort();
      currentRoomId = `room_${emails[0]}_${emails[1]}`;

      socket.emit('join_room', currentRoomId);
      roomStatus.textContent = `Room: ${targetUserEmail}`;
      messagesContainer.innerHTML = '<div class="date-divider"><span>Today</span></div>';
      renderedMessageIds.clear();
      messageInput.focus();
    }

    joinRoomBtn.addEventListener('click', () => {
      joinConversationRoom(partnerEmailInput.value);
    });

    partnerEmailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        joinConversationRoom(partnerEmailInput.value);
      }
    });

    socket.on('connect', () => {
      console.log('Connected to real-time chat via Socket.IO');
      if (currentRoomId) {
        socket.emit('join_room', currentRoomId);
      }
    });

    function formatTime(isoString) {
      const date = isoString ? new Date(isoString) : new Date();
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function isNearBottom() {
      const threshold = 100;
      return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight <= threshold;
    }

    function scrollToBottom(smooth = false) {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    const renderedMessageIds = new Set();
    function appendMessage(text, isOutgoing = true, timestamp, messageId = null) {
      if (messageId && renderedMessageIds.has(messageId)) {
        return;
      }
      if (messageId) {
        renderedMessageIds.add(messageId);
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      timeSpan.innerHTML = `${formatTime(timestamp)} ${isOutgoing ? '<span class="check-marks">✓✓</span>' : ''}`;

      contentDiv.textContent = text;
      contentDiv.appendChild(timeSpan);
      messageDiv.appendChild(contentDiv);

      const shouldScroll = isOutgoing || isNearBottom();
      messagesContainer.appendChild(messageDiv);

      if (shouldScroll) {
        scrollToBottom(true);
      }
    }

    socket.on('new_message', (msg) => {
      appendMessage(msg.message, msg.senderId === currentUser.id, msg.createdAt, msg.id);
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      if (!currentRoomId) {
        alert('Please enter a user email and click Join first!');
        partnerEmailInput.focus();
        return;
      }

      messageInput.value = '';

      socket.emit('send_message', {
        roomId: currentRoomId,
        senderId: currentUser.id,
        message: text
      }, (ack) => {
        if (ack && ack.error) {
          alert(ack.error);
        }
      });
    });

    logoutBtn.addEventListener('click', () => {
      socket.disconnect();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
