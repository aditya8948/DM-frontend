<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - DM</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="user-info">
        <div class="avatar" id="user-avatar">--</div>
        <div>
          <h3 class="user-name" id="user-display-name">Chat</h3>
          <span class="user-status">online</span>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </header>

    <!-- Chat Messages Body -->
    <main class="chat-messages" id="chat-messages">
      <div class="date-divider"><span>Today</span></div>
    </main>

    <!-- Bottom Message Input Box -->
    <footer class="chat-input-area">
      <form id="chat-form" class="chat-form">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Type a message..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="send-btn" class="send-btn" title="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script>
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const userAvatar = document.getElementById('user-avatar');

    // 1. Auth Guard
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user'));

    if (!token || !currentUser) {
      window.location.href = 'login.html';
    } else {
      userDisplayName.textContent = currentUser.name;
      userAvatar.textContent = (currentUser.name || 'U').slice(0, 2).toUpperCase();
    }

    // Target chat partner ID (for testing 1-on-1: if user 1, chat with 2, else chat with 1)
    const receiverId = currentUser && currentUser.id === 1 ? 2 : 1;

    // 2. Format Timestamp
    function formatTime(isoString) {
      const date = isoString ? new Date(isoString) : new Date();
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // 3. Scroll Behavior
    function isNearBottom() {
      const threshold = 100;
      return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight <= threshold;
    }

    function scrollToBottom(smooth = false) {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    // 4. Render message bubble
    function appendMessage(text, isOutgoing = true, timestamp) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      timeSpan.innerHTML = `${formatTime(timestamp)} ${isOutgoing ? '<span class="check-marks">✓✓</span>' : ''}`;

      contentDiv.textContent = text;
      contentDiv.appendChild(timeSpan);
      messageDiv.appendChild(contentDiv);

      const shouldScroll = isOutgoing || isNearBottom();
      messagesContainer.appendChild(messageDiv);

      if (shouldScroll) {
        scrollToBottom(true);
      }
    }

    // 5. Fetch Chat History from Backend
    let previousCount = 0;
    async function loadMessages() {
      try {
        const response = await fetch(`http://localhost:5000/api/v1/messages/${receiverId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) return;

        const result = await response.json();
        const messages = result.data || [];

        // Only re-render if message count changed
        if (messages.length !== previousCount) {
          previousCount = messages.length;
          messagesContainer.innerHTML = '<div class="date-divider"><span>Today</span></div>';

          messages.forEach((msg) => {
            const isOutgoing = msg.senderId === currentUser.id;
            appendMessage(msg.message, isOutgoing, msg.createdAt);
          });

          scrollToBottom(false);
        }
      } catch (err) {
        console.error('Failed to load messages:', err);
      }
    }

    // Initial load
    loadMessages();
    messageInput.focus();

    // Auto-poll every 3 seconds for new messages
    setInterval(loadMessages, 3000);

    // 6. Handle Send Message
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = '';

      try {
        const response = await fetch('http://localhost:5000/api/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            receiverId: receiverId,
            message: text
          })
        });

        const result = await response.json();

        if (!response.ok) {
          alert(result.error || 'Failed to send message');
          return;
        }

        appendMessage(result.data.message, true, result.data.createdAt);
        previousCount++;
        scrollToBottom(true);
      } catch (err) {
        console.error(err);
        alert('Could not connect to the server.');
      }
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
