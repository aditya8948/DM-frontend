<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat service </title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title">Chat service</div>
    <div class="header-right">
      <div class="header-user-badge">
        <div class="header-user-avatar" id="current-user-avatar">--</div>
        <span id="current-user-name">User</span>
      </div>
      <button type="button" class="header-logout-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="chat-container">
    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="user-search" placeholder="Search email or #group..." autocomplete="off" />
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-content">
        <div>
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">Groups</span>
            <button type="button" class="create-group-btn" id="create-group-btn" title="Create or join group">+</button>
          </div>
          <div class="groups-list" id="groups-list"></div>
        </div>
        <div>
          <div class="sidebar-section-header">
            <span class="sidebar-section-title">Direct Messages</span>
          </div>
          <div class="users-list" id="users-list"></div>
        </div>
      </div>
    </aside>

    <main class="chat-panel">
      <div class="chat-card">
        <div class="chat-card-header">
          <span id="chat-partner-label">Select a group or user to start chatting</span>
          <span id="room-badge" style="font-size: 12px; color: #1e88e5; font-weight: 500;"></span>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <form class="chat-input-bar" id="chat-form">
          <input type="file" id="media-input" style="display: none;" />
          <button type="button" class="attach-btn" id="attach-btn" title="Send image or file">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user'));

    if (!token || !currentUser) {
      window.location.href = 'login.html';
    }

    const currentUserNameEl = document.getElementById('current-user-name');
    const currentUserAvatarEl = document.getElementById('current-user-avatar');
    const userSearchInput = document.getElementById('user-search');
    const usersList = document.getElementById('users-list');
    const groupsList = document.getElementById('groups-list');
    const createGroupBtn = document.getElementById('create-group-btn');
    const chatPartnerLabel = document.getElementById('chat-partner-label');
    const roomBadge = document.getElementById('room-badge');
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const mediaInput = document.getElementById('media-input');
    const attachBtn = document.getElementById('attach-btn');
    const logoutBtn = document.getElementById('logout-btn');

    if (currentUser) {
      currentUserNameEl.textContent = currentUser.name || currentUser.email;
      currentUserAvatarEl.textContent = (currentUser.name || currentUser.email || 'U').slice(0, 2).toUpperCase();
    }

    let allUsers = [];
    let savedGroups = JSON.parse(localStorage.getItem('chat_groups')) || ['#general', '#random'];
    let selectedPartner = null;
    let selectedGroup = null;
    let currentRoomId = null;
    const renderedMessageIds = new Set();

    const socket = io('http://localhost:5000');

    socket.on('connect', () => {
      if (currentRoomId) {
        socket.emit('join_room', currentRoomId);
      }
    });

    function formatTime(isoString) {
      const date = isoString ? new Date(isoString) : new Date();
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function isNearBottom() {
      const threshold = 120;
      return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight <= threshold;
    }

    function scrollToBottom(smooth = false) {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function appendMessage(text, isOutgoing, timestamp, messageId, senderName, fileUrl, fileName, fileType) {
      if (messageId && renderedMessageIds.has(messageId)) {
        return;
      }
      if (messageId) {
        renderedMessageIds.add(messageId);
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';

      const authorPrefix = isOutgoing ? 'You' : (senderName || 'Partner');
      const headerSpan = document.createElement('div');
      headerSpan.style.fontWeight = '600';
      headerSpan.style.marginBottom = '4px';
      headerSpan.textContent = authorPrefix;
      bubbleDiv.appendChild(headerSpan);

      if (text && text.trim()) {
        const textP = document.createElement('div');
        textP.textContent = text;
        bubbleDiv.appendChild(textP);
      }

      if (fileUrl) {
        const isImage = (fileType && fileType.startsWith('image/')) || /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(fileUrl);
        if (isImage) {
          const img = document.createElement('img');
          img.src = fileUrl;
          img.className = 'chat-media-preview';
          img.alt = fileName || 'Uploaded image';
          img.addEventListener('click', () => window.open(fileUrl, '_blank'));
          bubbleDiv.appendChild(img);
        } else {
          const fileLink = document.createElement('a');
          fileLink.href = fileUrl;
          fileLink.target = '_blank';
          fileLink.className = 'chat-file-link';
          fileLink.textContent = `Attachment: ${fileName || 'Download file'}`;
          bubbleDiv.appendChild(fileLink);
        }
      }

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = formatTime(timestamp);

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);

      const shouldScroll = isOutgoing || isNearBottom();
      messagesContainer.appendChild(messageDiv);

      if (shouldScroll) {
        scrollToBottom(true);
      }
    }

    function selectGroup(groupName) {
      const normalized = groupName.startsWith('#') ? groupName : '#' + groupName;
      if (!savedGroups.includes(normalized)) {
        savedGroups.push(normalized);
        localStorage.setItem('chat_groups', JSON.stringify(savedGroups));
      }

      selectedGroup = normalized;
      selectedPartner = null;
      currentRoomId = normalized;
      userSearchInput.value = normalized;

      socket.emit('join_room', currentRoomId);

      chatPartnerLabel.textContent = `Group: ${normalized}`;
      roomBadge.textContent = currentRoomId;

      messagesContainer.innerHTML = '';
      renderedMessageIds.clear();

      renderGroupList(getFilteredGroups());
      renderUserList(getFilteredUsers());

      messageInput.focus();
    }

    function selectUser(partner) {
      selectedPartner = partner;
      selectedGroup = null;
      userSearchInput.value = partner.email;

      const emails = [currentUser.email.toLowerCase(), partner.email.toLowerCase()].sort();
      currentRoomId = `room_${emails[0]}_${emails[1]}`;

      socket.emit('join_room', currentRoomId);

      chatPartnerLabel.textContent = `${partner.name} (${partner.email})`;
      roomBadge.textContent = currentRoomId;

      messagesContainer.innerHTML = '';
      renderedMessageIds.clear();

      renderGroupList(getFilteredGroups());
      renderUserList(getFilteredUsers());

      messageInput.focus();
    }

    function renderGroupList(groups) {
      groupsList.innerHTML = '';
      if (!groups || groups.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'rgba(255, 255, 255, 0.75)';
        empty.style.fontSize = '12px';
        empty.style.padding = '6px 4px';
        empty.textContent = 'No matching groups';
        groupsList.appendChild(empty);
        return;
      }

      groups.forEach(group => {
        const item = document.createElement('div');
        item.className = 'user-item' + (selectedGroup === group ? ' active' : '');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'user-item-name';
        nameSpan.textContent = group;

        const infoSpan = document.createElement('span');
        infoSpan.className = 'user-item-email';
        infoSpan.textContent = 'Group Chat';

        item.appendChild(nameSpan);
        item.appendChild(infoSpan);

        item.addEventListener('click', () => {
          selectGroup(group);
        });

        groupsList.appendChild(item);
      });
    }

    function renderUserList(users) {
      usersList.innerHTML = '';
      if (!users || users.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'rgba(255, 255, 255, 0.75)';
        empty.style.fontSize = '12px';
        empty.style.padding = '6px 4px';
        empty.textContent = 'No matching users found';
        usersList.appendChild(empty);
        return;
      }

      users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-item' + (selectedPartner && selectedPartner.email.toLowerCase() === user.email.toLowerCase() ? ' active' : '');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'user-item-name';
        nameSpan.textContent = user.name;

        const emailSpan = document.createElement('span');
        emailSpan.className = 'user-item-email';
        emailSpan.textContent = user.email;

        item.appendChild(nameSpan);
        item.appendChild(emailSpan);

        item.addEventListener('click', () => {
          selectUser(user);
        });

        usersList.appendChild(item);
      });
    }

    function getFilteredGroups() {
      const q = userSearchInput.value.trim().toLowerCase();
      if (!q) {
        return savedGroups;
      }
      const cleanQ = q.startsWith('#') ? q.slice(1) : q;
      return savedGroups.filter(g => g.toLowerCase().includes(cleanQ));
    }

    function getFilteredUsers() {
      const q = userSearchInput.value.trim().toLowerCase();
      if (!q) {
        return allUsers;
      }
      if (q.startsWith('#')) {
        return [];
      }
      return allUsers.filter(u => 
        u.email.toLowerCase().includes(q) || 
        (u.name && u.name.toLowerCase().includes(q))
      );
    }

    userSearchInput.addEventListener('input', () => {
      renderGroupList(getFilteredGroups());
      renderUserList(getFilteredUsers());
    });

    userSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const query = userSearchInput.value.trim().toLowerCase();
        if (!query) return;

        if (query.startsWith('#')) {
          selectGroup(query);
          return;
        }

        const matchedUser = allUsers.find(u => 
          u.email.toLowerCase() === query || 
          (u.name && u.name.toLowerCase() === query)
        );

        if (matchedUser) {
          selectUser(matchedUser);
        } else {
          selectUser({ id: null, name: query, email: query });
        }
      }
    });

    createGroupBtn.addEventListener('click', () => {
      const name = prompt('Enter group name (e.g. general, dev-team):');
      if (name && name.trim()) {
        const cleanName = name.trim().replace(/\s+/g, '-').toLowerCase();
        const groupTag = cleanName.startsWith('#') ? cleanName : '#' + cleanName;
        selectGroup(groupTag);
      }
    });

    async function fetchUsers() {
      try {
        const res = await fetch('http://localhost:5000/api/v1/users', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();
        if (data && data.users) {
          allUsers = data.users;
          renderGroupList(getFilteredGroups());
          renderUserList(allUsers);
        }
      } catch (err) {
        console.error(err);
      }
    }

    fetchUsers();

    socket.on('new_message', (msg) => {
      const isOutgoing = msg.senderId === currentUser.id;
      const senderName = isOutgoing ? currentUser.name : (msg.senderName || (selectedPartner ? selectedPartner.name : 'Partner'));
      appendMessage(msg.message, isOutgoing, msg.createdAt, msg.id, senderName, msg.fileUrl, msg.fileName, msg.fileType);
    });

    attachBtn.addEventListener('click', () => {
      if (!currentRoomId) {
        alert('Please select a group or user to chat with first!');
        userSearchInput.focus();
        return;
      }
      mediaInput.click();
    });

    mediaInput.addEventListener('change', async () => {
      const file = mediaInput.files[0];
      if (!file) return;

      if (!currentRoomId) {
        alert('Please select a group or user to chat with first!');
        return;
      }

      const formData = new FormData();
      formData.append('media', file);
      formData.append('roomId', currentRoomId);
      if (selectedPartner && selectedPartner.id) {
        formData.append('receiverId', selectedPartner.id);
      }
      const optionalText = messageInput.value.trim();
      if (optionalText) {
        formData.append('message', optionalText);
        messageInput.value = '';
      }

      try {
        attachBtn.style.opacity = '0.4';
        attachBtn.disabled = true;

        const res = await fetch('http://localhost:5000/api/v1/messages/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Failed to upload media');
        }
      } catch (err) {
        console.error(err);
        alert('Media upload failed. Please check backend connection.');
      } finally {
        attachBtn.style.opacity = '1';
        attachBtn.disabled = false;
        mediaInput.value = '';
      }
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      if (!currentRoomId) {
        alert('Please select a group or user to chat with first!');
        userSearchInput.focus();
        return;
      }

      messageInput.value = '';

      socket.emit('send_message', {
        roomId: currentRoomId,
        senderId: currentUser.id,
        receiverId: selectedPartner ? selectedPartner.id : null,
        senderName: currentUser.name,
        message: text
      }, (ack) => {
        if (ack && ack.error) {
          alert(ack.error);
        }
      });
    });

    logoutBtn.addEventListener('click', () => {
      socket.disconnect();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
