<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat service </title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title">Chat service</div>
    <div class="header-right">
      <div class="header-user-badge">
        <div class="header-user-avatar" id="current-user-avatar">--</div>
        <span id="current-user-name">User</span>
      </div>
      <button type="button" class="header-logout-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="chat-container">
    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="user-search" placeholder="Search email..." autocomplete="off" />
      </div>
      <div class="sidebar-divider"></div>
      <div class="users-list" id="users-list"></div>
    </aside>

    <main class="chat-panel">
      <div class="chat-card">
        <div class="chat-card-header">
          <span id="chat-partner-label">Select a user from the list to start chatting</span>
          <span id="room-badge" style="font-size: 12px; color: #1e88e5; font-weight: 500;"></span>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <form class="chat-input-bar" id="chat-form">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user'));

    if (!token || !currentUser) {
      window.location.href = 'login.html';
    }

    const currentUserNameEl = document.getElementById('current-user-name');
    const currentUserAvatarEl = document.getElementById('current-user-avatar');
    const userSearchInput = document.getElementById('user-search');
    const usersList = document.getElementById('users-list');
    const chatPartnerLabel = document.getElementById('chat-partner-label');
    const roomBadge = document.getElementById('room-badge');
    const messagesContainer = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const logoutBtn = document.getElementById('logout-btn');

    if (currentUser) {
      currentUserNameEl.textContent = currentUser.name || currentUser.email;
      currentUserAvatarEl.textContent = (currentUser.name || currentUser.email || 'U').slice(0, 2).toUpperCase();
    }

    let allUsers = [];
    let selectedPartner = null;
    let currentRoomId = null;
    const renderedMessageIds = new Set();

    const socket = io('http://localhost:5000');

    socket.on('connect', () => {
      if (currentRoomId) {
        socket.emit('join_room', currentRoomId);
      }
    });

    function formatTime(isoString) {
      const date = isoString ? new Date(isoString) : new Date();
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function isNearBottom() {
      const threshold = 120;
      return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight <= threshold;
    }

    function scrollToBottom(smooth = false) {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function appendMessage(text, isOutgoing, timestamp, messageId, senderName) {
      if (messageId && renderedMessageIds.has(messageId)) {
        return;
      }
      if (messageId) {
        renderedMessageIds.add(messageId);
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';
      bubbleDiv.textContent = `${isOutgoing ? 'You' : (senderName || 'Partner')} : ${text}`;

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = formatTime(timestamp);

      messageDiv.appendChild(bubbleDiv);
      messageDiv.appendChild(timeDiv);

      const shouldScroll = isOutgoing || isNearBottom();
      messagesContainer.appendChild(messageDiv);

      if (shouldScroll) {
        scrollToBottom(true);
      }
    }


    function selectUser(partner) {
      selectedPartner = partner;
      userSearchInput.value = partner.email;

      const emails = [currentUser.email.toLowerCase(), partner.email.toLowerCase()].sort();
      currentRoomId = `room_${emails[0]}_${emails[1]}`;

      socket.emit('join_room', currentRoomId);

      chatPartnerLabel.textContent = `${partner.name} (${partner.email})`;
      roomBadge.textContent = currentRoomId;

      messagesContainer.innerHTML = '';
      renderedMessageIds.clear();

      renderUserList(getFilteredUsers());

      messageInput.focus();
    }

    function renderUserList(users) {
      usersList.innerHTML = '';
      if (!users || users.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'rgba(255, 255, 255, 0.75)';
        empty.style.fontSize = '13px';
        empty.style.padding = '8px 4px';
        empty.textContent = 'No matching users found';
        usersList.appendChild(empty);
        return;
      }

      users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-item' + (selectedPartner && selectedPartner.email.toLowerCase() === user.email.toLowerCase() ? ' active' : '');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'user-item-name';
        nameSpan.textContent = user.name;

        const emailSpan = document.createElement('span');
        emailSpan.className = 'user-item-email';
        emailSpan.textContent = user.email;

        item.appendChild(nameSpan);
        item.appendChild(emailSpan);

        item.addEventListener('click', () => {
          selectUser(user);
        });

        usersList.appendChild(item);
      });
    }

    function getFilteredUsers() {
      const q = userSearchInput.value.trim().toLowerCase();
      if (!q) {
        return allUsers;
      }
      return allUsers.filter(u => 
        u.email.toLowerCase().includes(q) || 
        (u.name && u.name.toLowerCase().includes(q))
      );
    }

    userSearchInput.addEventListener('input', () => {
      renderUserList(getFilteredUsers());
    });

    userSearchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const query = userSearchInput.value.trim().toLowerCase();
        if (!query) return;

        const matched = allUsers.find(u => 
          u.email.toLowerCase() === query || 
          (u.name && u.name.toLowerCase() === query)
        );

        if (matched) {
          selectUser(matched);
        } else {
          selectUser({ id: null, name: query, email: query });
        }
      }
    });

    async function fetchUsers() {
      try {
        const res = await fetch('http://localhost:5000/api/v1/users', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();
        if (data && data.users) {
          allUsers = data.users;
          renderUserList(allUsers);
        }
      } catch (err) {
        console.error(err);
      }
    }

    fetchUsers();

    socket.on('new_message', (msg) => {
      const isOutgoing = msg.senderId === currentUser.id;
      const senderName = isOutgoing ? currentUser.name : (msg.senderName || (selectedPartner ? selectedPartner.name : 'Partner'));
      appendMessage(msg.message, isOutgoing, msg.createdAt, msg.id, senderName);
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      if (!currentRoomId) {
        alert('Please select a user to chat with first!');
        userSearchInput.focus();
        return;
      }

      messageInput.value = '';

      socket.emit('send_message', {
        roomId: currentRoomId,
        senderId: currentUser.id,
        receiverId: selectedPartner ? selectedPartner.id : null,
        senderName: currentUser.name,
        message: text
      }, (ack) => {
        if (ack && ack.error) {
          alert(ack.error);
        }
      });
    });

    logoutBtn.addEventListener('click', () => {
      socket.disconnect();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
